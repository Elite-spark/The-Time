<!DOCTYPE html>
<html lang="en" dir="trl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Time</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold-glow: #FFD700;
            --glow-opacity: rgba(255, 215, 0, 0.5);
            --background-color: #000;
            --text-color: #F0F0F0;
            --sidebar-width: 280px;
            --primary-color: #FFD700;
            --secondary-color: #000;
            --accent-color: #8B7500;
        }

        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: var(--text-color);
            overflow-x: hidden;
        }
         
        .elite1-time-container {
            text-align: center;
            width: 100%;
            height: 100%; 
            padding: 15px;
            color: var(--gold-glow);
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            border: 0px solid var(--gold-glow);
            border-left: 0px solid var(--gold-glow);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: top;
            justify-content: center;
        }    
        
        .elite2-time-container {
            text-align: center;
            width: 100%;
            height: 80%; 
            margin-top: 15px;
            gap: 150px;
            background: transparent;
            border-radius: 20px;
            border: 0px solid var(--gold-glow);
            border-left: 0px solid var(--gold-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: row; 
        }    
                
        .elite-time-container {
            text-align: center;
            width: 90%;
            height: 60%; 
            padding: 15px;
            font-family: 'Orbitron', 'Roboto', sans-serif;
            color: var(--gold-glow);
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            border: 0px solid var(--gold-glow);
            border-left: 1px solid var(--gold-glow);
            box-shadow: 0 0 20px var(--glow-opacity);
            position: relative;
            overflow: hidden;
            margin-left: -20px;
        }

        .elite-time-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--gold-glow), 
                transparent);
            animation: scanline 3s linear infinite;
        }

        .time-display {
            margin-top: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1.8em;
            font-weight: 700;
            text-shadow: 
                0 0 10px var(--gold-glow),
                0 0 20px rgba(255, 215, 0, 0.5),
                0 0 30px rgba(255, 215, 0, 0.3);
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
        }

        .time-segment {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--gold-glow);
            min-width: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .time-separator {
            font-size: 1.8em;
            opacity: 0.8;
            animation: pulse 2s infinite;
            text-shadow: 0 0 15px var(--gold-glow);
        }

        .ampm-indicator {
            font-size: 0.8em;
            background: rgba(255, 255, 255, 0.05);
            color: var(--gold-glow);
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 20px;
            border: 1px solid var(--gold-glow);
            backdrop-filter: blur(5px);
        }

        .date-display {
            margin-top: 3px;
            font-size: 0.9em;
            color: var(--gold-glow);
            text-shadow: 
                0 0 10px var(--gold-glow),
                0 0 20px rgba(255, 215, 0, 0.5),
                0 0 30px rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column; 
            gap: 10px;
            padding: 5px 5px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            border: 0px solid var(--gold-glow);
        }

        .date-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* مؤشرات حية */
        .time-indicators {
            position: absolute;
            margin-bottom: 30px;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
        }

        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold-glow);
            box-shadow: 0 0 10px #00ff00;
            animation: indicatorPulse 1.5s infinite;
        }

        .indicator-dot:nth-child(2) {
            background: var(--gold-glow);
            animation-delay: 0.3s;
        }        

        .indicator-dot:nth-child(3) {
            background: var(--gold-glow);
            animation-delay: 0.6s;
        }

        /* زر Elite Time */
        .elite-time-btn {
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .elite-time-btn:hover {
            transform: scale(1.05);
            text-shadow: 
                0 0 15px var(--gold-glow),
                0 0 25px rgba(255, 215, 0, 0.7);
        }

        /* حاوية الميكروفون */
        .microphone-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 30px;
        }

        /* بار الصوت */
        .audio-visualizer {
            width: 90%;
            height: 120px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            border: 1px solid var(--gold-glow);
            box-shadow: 0 0 20px var(--glow-opacity);
        }

        .audio-bar {
            width: 8px;
            min-height: 4px;
            background: linear-gradient(to top, 
                var(--gold-glow), 
                #ffed4e);
            border-radius: 4px 4px 0 0;
            transition: height 0.05s ease;
            box-shadow: 0 0 8px var(--gold-glow);
        }

        /* زر العودة */
        .back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--gold-glow);
            border: 1px solid var(--gold-glow);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2em;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            transform: scale(1.1);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        /* مؤشر مستوى الصوت */
        .mic-level {
            font-size: 0.9em;
            color: var(--gold-glow);
            text-shadow: 0 0 10px var(--gold-glow);
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--gold-glow);
            transition: all 0.3s ease;
        }

        /* حركات */
        @keyframes scanline {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes indicatorPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="elite1-time-container">
        <div class="elite-time-container">
            <!-- زر العودة -->
            <div class="back-btn" id="backBtn" style="display: none;">
                <i class="fas fa-arrow-left"></i>
            </div>

            <div class="time-indicators">
                <div class="indicator-dot"></div>
                <div class="indicator-dot"></div>
                <div class="indicator-dot"></div>
            </div> 

            <!-- الحاوية الأصلية للوقت والتاريخ -->
            <div class="elite2-time-container" id="timeDisplayContainer">
                <div class="time-display">
                    <div class="time-segment" id="elite-time">12</div>
                    <div class="time-separator">:</div>
                    <div class="time-segment" id="elite2-time">59</div>
                    <div class="ampm-indicator" id="elite3-time">PM</div>
                </div>
    
                <div class="date-display">
                    <div class="date-item">
                        <span id="elite1-time">الجمعة — 15 مارس</span>
                    </div>
                    <div class="date-item">
                        <span class="date-icon">⚡</span>
                        <span class="elite-time-btn" id="eliteTimeBtn">Elite Time</span>
                    </div>
                </div>
            </div>

            <!-- حاوية الميكروفون -->
            <div class="microphone-container" id="micContainer">
                <div class="audio-visualizer" id="audioVisualizer">
                    <!-- سيتم إضافة الأشرطة ديناميكياً -->
                </div>
                
                <div class="mic-level" id="micLevel">
                    حساسية الميكروفون: <span id="levelValue">0</span>%
                </div>
            </div>
        </div>
    </div>

<script>
    // العناصر الأساسية
    const eliteTimeBtn = document.getElementById('eliteTimeBtn');
    const timeDisplayContainer = document.getElementById('timeDisplayContainer');
    const micContainer = document.getElementById('micContainer');
    const audioVisualizer = document.getElementById('audioVisualizer');
    const backBtn = document.getElementById('backBtn');
    const levelValue = document.getElementById('levelValue');

    // متغيرات الميكروفون
    let audioContext, analyser, microphone;
    let isMicActive = false;
    const barCount = 50;

    // عند النقر على Elite Time
    eliteTimeBtn.addEventListener('click', async () => {
        try {
            // إخفاء الوقت وإظهار الميكروفون
            timeDisplayContainer.style.display = 'none';
            micContainer.style.display = 'flex';
            backBtn.style.display = 'flex';
            
            // تشغيل الميكروفون
            await startMicrophone();
        } catch (error) {
            console.log('الميكروفون غير متاح:', error);
            // العودة للوقت إذا فشل
           
        }
    });

    // زر العودة
    backBtn.addEventListener('click', () => {
        stopMicrophone();
        showTimeView();
    });

    // إظهار عرض الوقت
    function showTimeView() {
        micContainer.style.display = 'none';
        backBtn.style.display = 'none';
        timeDisplayContainer.style.display = 'flex';
    }

    // تشغيل الميكروفون
    async function startMicrophone() {
        if (isMicActive) return;
        
        // طلب إذن الميكروفون
        const stream = await navigator.mediaDevices.getUserMedia({ 
            audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
            } 
        });
        
        // إنشاء سياق الصوت
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        
        // إعدادات حساسية عالية
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.2; // أقل سلاسة لحساسية أعلى
        analyser.minDecibels = -90;
        analyser.maxDecibels = -10;
        
        // ربط الميكروفون
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        
        isMicActive = true;
        createAudioBars();
        updateVisualizer();
    }

    // إنشاء أشرطة الصوت
    function createAudioBars() {
        audioVisualizer.innerHTML = '';
        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.className = 'audio-bar';
            bar.style.height = '4px';
            audioVisualizer.appendChild(bar);
        }
    }

    // تحديث البار الصوتي
    function updateVisualizer() {
        if (!isMicActive) return;
        
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        const bars = document.querySelectorAll('.audio-bar');
        
        function update() {
            if (!isMicActive) return;
            
            analyser.getByteFrequencyData(dataArray);
            let max = 0;
            
            bars.forEach((bar, i) => {
                // حساسية عالية: استخدام متوسط الترددات
                const start = Math.floor(i * bufferLength / barCount);
                const end = Math.floor((i + 1) * bufferLength / barCount);
                let sum = 0;
                
                for (let j = start; j < end; j++) {
                    sum += dataArray[j];
                    if (dataArray[j] > max) max = dataArray[j];
                }
                
                const avg = sum / (end - start);
                const height = 4 + (avg / 255) * 110; // تضخيم للارتفاع
                bar.style.height = `${height}px`;
                
                // تحديث اللون بناءً على شدة الصوت
                const intensity = avg / 255;
                const hue = 51; // اللون الذهبي من المتغير
                const saturation = 70 + (intensity * 30);
                const lightness = 50 + (intensity * 30);
                
                bar.style.background = `linear-gradient(to top, 
                    var(--gold-glow), 
                    hsl(${hue}, ${saturation}%, ${lightness}%))`;
                
                bar.style.boxShadow = `0 0 ${8 + intensity * 20}px var(--gold-glow)`;
            });
            
            // تحديث مؤشر المستوى
            const level = Math.min(100, Math.round((max / 255) * 100 * 1.3));
            levelValue.textContent = level;
            
            // استمرار التحديث
            requestAnimationFrame(update);
        }
        
        update();
    }

    // إيقاف الميكروفون
    function stopMicrophone() {
        if (!isMicActive) return;
        
        // قطع اتصال الميكروفون
        if (microphone) {
            microphone.disconnect();
            microphone.mediaStream.getTracks().forEach(track => track.stop());
        }
        
        // إغلاق سياق الصوت
        if (audioContext && audioContext.state !== 'closed') {
            audioContext.close();
        }
        
        isMicActive = false;
    }

    // تحديث اللون من التطبيق
    function updateThemeColor() {
        try {
            let newColor = window.AppInventor.getWebViewString();
            
            if (newColor && newColor.length > 3) {
                document.documentElement.style.setProperty('--gold-glow', newColor);
                let glowColor = newColor + "4D";
                document.documentElement.style.setProperty('--glow-opacity', glowColor);
            }
        } catch (e) {
            // تجاهل في حالة عدم وجود التطبيق
        }
    }

    // تحديث الوقت
    function updateTime() {
        const now = new Date();
        const optionsDay = { weekday: 'long' };
        const optionsDate = { day: 'numeric', month: 'short' };
        
        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();
        
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;
        
        const day = now.toLocaleDateString('AR', optionsDay);
        const date = now.toLocaleDateString('AR', optionsDate);
        
        const timeElements = {
            "elite-time": hours,
            "elite2-time": minutes,
            "elite3-time": ampm,
            "elite1-time": `${day} — ${date}`,
        };
        
        for (const [id, value] of Object.entries(timeElements)) {
            const element = document.getElementById(id);
            if (element) element.innerText = value;
        }
        
        updateThemeColor();
    }
    
    // التهيئة
    document.addEventListener('DOMContentLoaded', function() {
        updateTime();
        setInterval(updateTime, 1000);
    });
</script>
</body>
</html>
