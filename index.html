<!DOCTYPE html>
<html lang="en" dir="trl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Time</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold-glow: #FFD700;
            --glow-opacity: rgba(255, 215, 0, 0.5);
            --background-color: #000;
            --text-color: #F0F0F0;
        }

        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: var(--text-color);
        }
         
        .elite1-time-container {
            text-align: center;
            width: 100%;
            height: 100%; 
            padding: 15px;
            color: var(--gold-glow);
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            display: flex;
            align-items: top;
            justify-content: center;
        }    
        
        .elite2-time-container {
            text-align: center;
            width: 100%;
            height: 80%; 
            margin-top: 15px;
            gap: 150px;
            background: transparent;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: row; 
        }    
                
        .elite-time-container {
            text-align: center;
            width: 90%;
            height: 60%; 
            padding: 15px;
            font-family: 'Orbitron', 'Roboto', sans-serif;
            color: var(--gold-glow);
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            border-left: 1px solid var(--gold-glow);
            box-shadow: 0 0 20px var(--glow-opacity);
            position: relative;
            overflow: hidden;
            margin-left: -20px;
        }

        .time-display {
            margin-top: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1.8em;
            font-weight: 700;
            text-shadow: 
                0 0 10px var(--gold-glow),
                0 0 20px rgba(255, 215, 0, 0.5),
                0 0 30px rgba(255, 215, 0, 0.3);
            letter-spacing: 2px;
        }

        .time-segment {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--gold-glow);
            min-width: 30px;
            backdrop-filter: blur(10px);
        }

        .time-separator {
            font-size: 1.8em;
            opacity: 0.8;
            animation: pulse 2s infinite;
        }

        .ampm-indicator {
            font-size: 0.8em;
            background: rgba(255, 255, 255, 0.05);
            color: var(--gold-glow);
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 20px;
            border: 1px solid var(--gold-glow);
        }

        .date-display {
            margin-top: 3px;
            font-size: 0.9em;
            color: var(--gold-glow);
            text-shadow: 
                0 0 10px var(--gold-glow),
                0 0 20px rgba(255, 215, 0, 0.5),
                0 0 30px rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column; 
            gap: 10px;
            padding: 5px 5px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
        }

        .date-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* زر Elite Time */
        .elite-time-btn {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .elite-time-btn:hover {
            transform: scale(1.05);
        }

        /* حاوية الميكروفون */
        .microphone-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 30px;
        }

        /* بار الصوت */
        .audio-visualizer {
            width: 90%;
            height: 120px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            border: 1px solid var(--gold-glow);
            box-shadow: 0 0 20px var(--glow-opacity);
        }

        .audio-bar {
            width: 7px;
            min-height: 2px;
            background: linear-gradient(to top, var(--gold-glow), #ffed4e);
            border-radius: 3px 3px 0 0;
            transition: height 0.1s ease;
        }

        /* زر العودة */
        .back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--gold-glow);
            border: 1px solid var(--gold-glow);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2em;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            transform: scale(1.1);
        }

        /* مؤشر مستوى الصوت */
        .mic-level {
            font-size: 0.9em;
            color: var(--gold-glow);
            text-shadow: 0 0 10px var(--gold-glow);
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--gold-glow);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="elite1-time-container">
        <div class="elite-time-container">
            <!-- زر العودة -->
            <div class="back-btn" id="backBtn" style="display: none;">
                <i class="fas fa-arrow-left"></i>
            </div>

            <!-- الحاوية الأصلية للوقت والتاريخ -->
            <div class="elite2-time-container" id="timeDisplayContainer">
                <div class="time-display">
                    <div class="time-segment" id="elite-time">12</div>
                    <div class="time-separator">:</div>
                    <div class="time-segment" id="elite2-time">59</div>
                    <div class="ampm-indicator" id="elite3-time">PM</div>
                </div>
    
                <div class="date-display">
                    <div class="date-item">
                        <span id="elite1-time">الجمعة — 15 مارس</span>
                    </div>
                    <div class="date-item">
                        <span class="date-icon">⚡</span>
                        <span class="elite-time-btn" id="eliteTimeBtn">Elite Time</span>
                    </div>
                </div>
            </div>

            <!-- حاوية الميكروفون -->
            <div class="microphone-container" id="micContainer">
                <div class="audio-visualizer" id="audioVisualizer">
                    <!-- سيتم إضافة الأشرطة ديناميكياً -->
                </div>
                
                <div class="mic-level" id="micLevel">
                    حساسية الميكروفون: <span id="levelValue">0</span>%
                </div>
            </div>
        </div>
    </div>

<script>
    // متغيرات الميكروفون
    let audioContext, analyser, microphone, isMicActive = false;
    const barCount = 50;
    let animationFrameId;

    // عند النقر على Elite Time
    document.getElementById('eliteTimeBtn').addEventListener('click', function() {
        // تبديل العرض
        document.getElementById('timeDisplayContainer').style.display = 'none';
        document.getElementById('micContainer').style.display = 'flex';
        document.getElementById('backBtn').style.display = 'flex';
        
        // بدء الميكروفون (دون انتظار)
        startMicrophone();
    });

    // زر العودة
    document.getElementById('backBtn').addEventListener('click', function() {
        stopMicrophone();
        document.getElementById('micContainer').style.display = 'none';
        document.getElementById('backBtn').style.display = 'none';
        document.getElementById('timeDisplayContainer').style.display = 'flex';
    });

// بدء الميكروفون
function startMicrophone() {
    if (isMicActive) return;
    
    // 1. أولاً، نطلب إذن الميكروفون
    navigator.mediaDevices.getUserMedia({ 
        audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            channelCount: 1
        }
    }).then(function(stream) {
        // 2. بعد الحصول على الإذن، نبدأ AudioContext
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        
        // 🔥 إعدادات حساسية عالية جداً 🔥
        analyser.fftSize = 2048; // زيادة من 2048 إلى 4096 لدقة أعلى
        analyser.smoothingTimeConstant = 0.3; // تقليل السلاسة لزيادة الحساسية
        analyser.minDecibels = -100; // حساسية للأصوات المنخفضة جداً
        analyser.maxDecibels = -5;   // رفع الحد الأعلى
        
        // ربط الميكروفون
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        
        isMicActive = true;
        createAudioBars();
        updateVisualizer();
        
    }).catch(function(error) {
        console.log('خطأ في الميكروفون:', error);
        // إذا فشل الميكروفون، نعرض بار وهمي بحساسية عالية
        simulateAudioBarsHighSensitivity();
    });
}

// محاكاة البار الصوتي بحساسية عالية (للاختبار)
function simulateAudioBarsHighSensitivity() {
    createAudioBars();
    const bars = document.querySelectorAll('.audio-bar');
    const barCount = bars.length;
    let frame = 0;
    
    function simulate() {
        frame++;
        
        bars.forEach((bar, i) => {
            // حساب المسافة من المنتصف
            const middleIndex = barCount / 2;
            const distanceFromMiddle = Math.abs(i - middleIndex);
            
            // 🔥 حساسية عالية: حتى الأصوات الضعيفة تخلق حركة 🔥
            const baseWave = Math.sin(frame * 0.03 + i * 0.15) * 40;
            const middleBoost = distanceFromMiddle < 5 ? 
                Math.sin(frame * 0.05) * 30 : 0;
            const randomNoise = Math.random() * 25;
            
            // تضخيم الأصوات الضعيفة
            let height = 15 + baseWave + middleBoost + randomNoise;
            
            // تضخيم إضافي للأعمدة الجانبية
            if (distanceFromMiddle > 15) {
                height = height * 0.9; // تقليل بسيط للحواف
            }
            
            height = Math.max(5, Math.min(120, height));
            bar.style.height = height + 'px';
            
            // تأثيرات التوهج
            const intensity = height / 120;
            
            if (distanceFromMiddle < 5) {
                // أعمدة المنتصف: أكثر توهجاً
                bar.style.boxShadow = `0 0 ${10 + intensity * 30}px var(--gold-glow)`;
                bar.style.background = `linear-gradient(to top, 
                    var(--gold-glow), 
                    hsl(51, ${90 + intensity * 10}%, ${65 + intensity * 35}%))`;
            } else {
                // الأعمدة الجانبية
                bar.style.boxShadow = `0 0 ${6 + intensity * 20}px var(--gold-glow)`;
                bar.style.background = `linear-gradient(to top, 
                    var(--gold-glow), 
                    hsl(51, ${75 + intensity * 25}%, ${55 + intensity * 25}%))`;
            }
        });
        
        // مستوى وهمي متغير
        const fakeLevel = 30 + Math.sin(frame * 0.08) * 40 + Math.random() * 30;
        document.getElementById('levelValue').textContent = Math.round(fakeLevel);
        
        animationFrameId = requestAnimationFrame(simulate);
    }
    
    simulate();
}

    // إنشاء أشرطة الصوت
    function createAudioBars() {
        const visualizer = document.getElementById('audioVisualizer');
        visualizer.innerHTML = '';
        
        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.className = 'audio-bar';
            bar.style.height = '2px';
            visualizer.appendChild(bar);
        }
    }

    // تحديث البار الصوتي (مع بيانات حقيقية)
function updateVisualizer() {
    if (!isMicActive) return;
    
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    const bars = document.querySelectorAll('.audio-bar');
    const barCount = bars.length;
    
    function update() {
        analyser.getByteFrequencyData(dataArray);
        let maxLevel = 0;
        
        bars.forEach((bar, i) => {
            // توزيع الترددات بشكل متناسق من اليسار واليمين
            let frequencyIndex;
            
            if (i < barCount / 2) {
                // النصف الأول (من اليسار للمنتصف)
                frequencyIndex = Math.floor((i / (barCount / 2)) * (bufferLength * 0.3));
            } else {
                // النصف الثاني (من المنتصف لليمين)
                const relativeIndex = i - (barCount / 2);
                frequencyIndex = Math.floor((relativeIndex / (barCount / 2)) * (bufferLength * 0.3));
            }
            
            // تضخيم الحساسية
            let value = dataArray[frequencyIndex] || 0;
            
            // تضخيم إضافي للأصوات المنخفضة
            if (value < 50) value = value * 2; // تضخيم ×3 للأصوات المنخفضة
            else if (value < 100) value = value * 2; // تضخيم ×2 للأصوات المتوسطة
            
            if (value > maxLevel) maxLevel = value;
            
            // حساب الارتفاع مع تضخيم كبير
            const baseHeight = 2;
            const amplifiedValue = Math.min(255, value * 1.5); // تضخيم إضافي
            const height = baseHeight + (amplifiedValue / 255) * 110;
            
            bar.style.height = height + 'px';
            
            // تأثير التوهج حسب الشدة
            const intensity = amplifiedValue / 255;
            
            // جعل الأعمدة في المنتصف أكثر حساسية للأصوات العالية
            const middleIndex = barCount / 2;
            const distanceFromMiddle = Math.abs(i - middleIndex);
            
            // إذا كان العمود في المنتصف، يزيد التوهج أكثر
            if (distanceFromMiddle < 5) {
                bar.style.boxShadow = `0 0 ${8 + intensity * 25}px var(--gold-glow)`;
                bar.style.background = `linear-gradient(to top, 
                    var(--gold-glow), 
                    hsl(51, ${85 + intensity * 15}%, ${60 + intensity * 40}%))`;
            } else {
                bar.style.boxShadow = `0 0 ${5 + intensity * 20}px var(--gold-glow)`;
                bar.style.background = `linear-gradient(to top, 
                    var(--gold-glow), 
                    hsl(51, ${70 + intensity * 30}%, ${50 + intensity * 30}%))`;
            }
        });
        
        // تحديث مؤشر المستوى مع تضخيم
        const amplifiedLevel = Math.min(100, Math.round((maxLevel / 255) * 100 * 1.8));
        document.getElementById('levelValue').textContent = amplifiedLevel;
        
        // استمرار التحديث
        animationFrameId = requestAnimationFrame(update);
    }
    
    update();
}


    
    // إيقاف الميكروفون
    function stopMicrophone() {
        if (!isMicActive) return;
        
        cancelAnimationFrame(animationFrameId);
        isMicActive = false;
        
        if (microphone) {
            microphone.disconnect();
            microphone.mediaStream.getTracks().forEach(track => track.stop());
        }
        
        if (audioContext && audioContext.state !== 'closed') {
            audioContext.close();
        }
    }

    // تحديث الوقت
    function updateTime() {
        const now = new Date();
        
        let hours = now.getHours();
        let minutes = now.getMinutes();
        
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        
        const day = now.toLocaleDateString('AR', { weekday: 'long' });
        const date = now.toLocaleDateString('AR', { day: 'numeric', month: 'short' });
        
        document.getElementById('elite-time').textContent = hours;
        document.getElementById('elite2-time').textContent = minutes;
        document.getElementById('elite3-time').textContent = ampm;
        document.getElementById('elite1-time').textContent = `${day} — ${date}`;
        
        // تحديث الألوان من التطبيق
        try {
            const newColor = window.AppInventor.getWebViewString();
            if (newColor && newColor.length > 3) {
                document.documentElement.style.setProperty('--gold-glow', newColor);
                document.documentElement.style.setProperty('--glow-opacity', newColor + '4D');
            }
        } catch (e) {}
    }

    // التشغيل
    updateTime();
    setInterval(updateTime, 1000);
</script>
</body>
</html>
