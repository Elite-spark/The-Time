<!DOCTYPE html>
<html lang="en" dir="trl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة Elite Spark - الطقس والتحكم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
       :root {
            --gold-glow: #FFD700;
            --background-color: #000;
            --text-color: #F0F0F0;
            --sidebar-width: 280px;
            --primary-color: #FFD700;
            --secondary-color: #000;
            --accent-color: #8B7500;
        }
       body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: var(--text-color);
            overflow-x: hidden;
            
        }
         
        .elite1-time-container {
            text-align: center;
            width: 100%;
            height: 100%; 
            padding: 15px;
            color: var(--gold-glow);
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            border: 0px solid var(--gold-glow);
            border-left: 0px solid var(--gold-glow);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: top;
            justify-content: center;
        }    
        
        .elite2-time-container {
            text-align: center;
            width: 100%;
            height: 80%; 
            margin-top: 15px;
            gap: 90px;
            background: transparent;
            border-radius: 20px;
            border: 0px solid var(--gold-glow);
            border-left: 0px solid var(--gold-glow);
            display: flex;
            align-items: center;
            justify-content: left;
            flex-direction: row; 
        }    
                
      .elite-time-container {
            text-align: center;
            width: 90%;
            height: 60%; 
            padding: 15px;
            font-family: 'Orbitron', 'Roboto', sans-serif;
            color: var(--gold-glow);
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            border: 0px solid var(--gold-glow);
            border-left: 1px solid var(--gold-glow);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
            margin-left: -20px;
            
        }

        .elite-time-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--gold-glow), 
                transparent);
            animation: scanline 3s linear infinite;
        }

        .time-display {
            margin-top: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1.8em;
            font-weight: 700;
            text-shadow: 
                0 0 10px var(--gold-glow),
                0 0 20px rgba(255, 215, 0, 0.5),
                0 0 30px rgba(255, 215, 0, 0.3);
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
        }

        .time-segment {
            background: linear-gradient(135deg, 
                rgba(255, 215, 0, 0.1), 
                rgba(255, 215, 0, 0.05));
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            min-width: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .time-segment:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.2);
        }

        .time-separator {
            font-size: 1.8em;
            opacity: 0.8;
            animation: pulse 2s infinite;
            text-shadow: 0 0 15px var(--gold-glow);
        }

        .ampm-indicator {
            font-size: 0.8em;
            background: linear-gradient(135deg, 
                var(--gold-glow), 
                #ff9900);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .date-display {
            margin-top: 3px;
            font-size: 0.9em;
            color: var(--gold-glow);
            text-shadow: 
                0 0 10px var(--gold-glow),
                0 0 20px rgba(255, 215, 0, 0.5),
                0 0 30px rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column; 
            gap: 10px;
            padding: 5px 5px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            border: 0px solid var(--gold-glow);
    
        }

        .date-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* مؤشرات حية */
        .time-indicators {
            position: absolute;
            margin-bottom: 30px;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
        }

        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
            animation: indicatorPulse 1.5s infinite;
        }

        .indicator-dot:nth-child(2) {
            background: #ffff00;
            animation-delay: 0.3s;
        }        

        .indicator-dot:nth-child(3) {
            background: #ff4444;
            animation-delay: 0.6s;
        }

        /* حركات */
        @keyframes scanline {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes indicatorPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px var(--gold-glow); }
            50% { text-shadow: 0 0 20px var(--gold-glow); }
        }
        
        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>

</head>
<body>
     
     
     
     
     
              <div class="elite1-time-container">
                <div class="elite-time-container">
                    <div class="time-indicators">
                        <div class="indicator-dot"></div>
                        <div class="indicator-dot"></div>
                        <div class="indicator-dot"></div>
                    </div> 

                    <div class="elite2-time-container">
    
                    <div class="time-display">
                        <div class="time-segment" id="elite-time">12</div>
                        <div class="time-separator">:</div>
                        <div class="time-segment" id="elite2-time">59</div>
                        <div class="ampm-indicator" id="elite3-time">PM</div>
                    </div>
    
                    <div class="date-display">
                        <div class="date-item">
                            <span id="elite1-time">الجمعة — 15 مارس</span>
                        </div>
                        <div class="date-item">
                            <span class="date-icon">⚡</span>
                            <span>Elite Time</span>
                        </div>
                    </div>

                    </div>

                </div>
              </div>
              

<script>
    // سكربت تحديث الوقت
        function updateTime() {
            const now = new Date();
            const optionsDay = { weekday: 'long' };
            const optionsDate = { day: 'numeric', month: 'short' };
    
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
    
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
    
            const day = now.toLocaleDateString('AR', optionsDay);
            const date = now.toLocaleDateString('AR', optionsDate);
    
            // لكل عنصر
            const timeElements = {
                "elite-time": hours,
                "elite2-time": minutes,
                "elite3-time": ampm,
                "elite1-time": `${day} — ${date}`,
                "elite-seconds": seconds,
                "elite-day": day,
                "elite-date": date,
                "elite-full-date": now.toLocaleDateString('AR', { 
                    weekday: 'long', 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                })
            };
    
            // تحديث جميع العناصر
            for (const [id, value] of Object.entries(timeElements)) {
                const element = document.getElementById(id);
                if (element) {
                    element.innerText = value;
            
                    // إضافة تأثير عند تغيير الدقائق
                    if (id === "elite2-time" && now.getSeconds() === 0) {
                        element.style.transform = "scale(1.1)";
                        setTimeout(() => {
                            element.style.transform = "scale(1)";
                        }, 300);
                    }
                }
            }
    
            // تأثيرات إضافية كل 10 ثواني
            if (now.getSeconds() % 10 === 0) {
                document.querySelectorAll('.time-segment, .digit, .neu-hour, .neu-minute').forEach(el => {
                    el.style.filter = "brightness(1.2)";
                    setTimeout(() => {
                        el.style.filter = "brightness(1)";
                    }, 500);
                });
            }
        }
        setInterval(updateTime, 1000);
        updateTime();
 </script>
